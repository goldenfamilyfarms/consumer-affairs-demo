name: Observability Workflow

on:
  workflow_run:
    workflows:
      - Security Workflow
      - Performance Workflow
      - Data Quality Workflow
      - Reliability Workflow
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  incident-context-packet:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Create incident context issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `Incident packet: ${run.name} failed on ${run.head_branch}`;
            const body = [
              '## Automated incident context',
              `- Workflow: ${run.name}`,
              `- Run ID: ${run.id}`,
              `- Branch: ${run.head_branch}`,
              `- Commit: ${run.head_sha}`,
              `- Trigger: ${run.event}`,
              `- URL: ${run.html_url}`,
              '',
              'Please add root cause, mitigation, and follow-up items.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['incident', 'observability']
            });
