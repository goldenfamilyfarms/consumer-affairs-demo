name: Feature Flag Workflow

on:
  pull_request:
    paths:
      - ".config/feature-flags.yaml"
      - "scripts/ci/validate_feature_flags.py"
  workflow_dispatch:
    inputs:
      flag_name:
        description: "Flag to update"
        required: false
      enabled:
        description: "Set enabled=true or enabled=false"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install pyyaml
      - name: Validate feature-flag manifest
        run: python scripts/ci/validate_feature_flags.py

  kill-switch-pr:
    if: github.event_name == 'workflow_dispatch' && inputs.flag_name != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toggle feature flag
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = Path('.config/feature-flags.yaml')
          data = yaml.safe_load(config.read_text())
          target = '${{ inputs.flag_name }}'
          enabled = '${{ inputs.enabled }}'.lower() == 'true'
          for flag in data.get('flags', []):
            if flag.get('name') == target:
              flag['enabled'] = enabled
              break
          else:
            raise SystemExit(f'Flag not found: {target}')
          config.write_text(yaml.safe_dump(data, sort_keys=False), encoding='utf-8')
          PY
      - name: Open feature-flag change PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/feature-flag-toggle-${{ inputs.flag_name }}
          commit-message: "chore: toggle feature flag ${{ inputs.flag_name }}"
          title: "chore: toggle feature flag ${{ inputs.flag_name }}"
          body: "Automated feature-flag update generated from workflow_dispatch."
