name: Reliability Workflow

on:
  pull_request:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  smoke-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt
          cd frontend && npm ci
      - name: Run smoke tests
        run: |
          .venv/bin/python backend/manage.py migrate
          .venv/bin/python backend/manage.py import_wordpress
          cd backend && ../.venv/bin/python -m pytest -q api/tests/test_api_contract.py catalog/tests/test_views.py
          cd ../frontend && npm test -- --run src/components/BrandList/BrandList.test.jsx

  flaky-detection:
    runs-on: ubuntu-latest
    needs: smoke-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt
      - name: Repeat backend critical tests to detect flakes
        id: flaky
        run: |
          set +e
          .venv/bin/python backend/manage.py migrate
          .venv/bin/python backend/manage.py import_wordpress
          cd backend
          ../.venv/bin/python -m pytest -q api/tests/test_api_contract.py > /tmp/run1.txt
          RUN1=$?
          ../.venv/bin/python -m pytest -q api/tests/test_api_contract.py > /tmp/run2.txt
          RUN2=$?
          set -e
          if [ "$RUN1" != "$RUN2" ]; then
            echo "is_flaky=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_flaky=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Route flaky test issue
        if: steps.flaky.outputs.is_flaky == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Flaky test detected in reliability workflow',
              body: 'A critical test produced inconsistent outcomes across repeated runs. Please quarantine and assign ownership.',
              labels: ['reliability', 'flaky-test']
            });
