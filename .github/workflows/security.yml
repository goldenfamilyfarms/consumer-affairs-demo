name: Security Workflow

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -r backend/requirements.txt
          pip-audit -r backend/requirements.txt
      - name: Node dependency audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  remediation-pr:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Attempt automatic dependency remediation
        run: |
          npm --prefix frontend audit fix --package-lock-only || true
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --fix || true
      - name: Create remediation PR if needed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: apply automated dependency remediation"
          branch: ci/auto-remediation
          title: "chore: automated security dependency remediation"
          body: "Automated dependency remediation generated by the scheduled security workflow."
