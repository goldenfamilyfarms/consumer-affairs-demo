name: Environment Preview Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build backend/frontend preview artifacts
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt
          .venv/bin/python backend/manage.py migrate
          .venv/bin/python backend/manage.py import_wordpress
          cd frontend && npm ci && npm run build
      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: |
            backend/db.sqlite3
            frontend/dist
      - name: Publish preview status comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: 'Preview artifacts built and attached to this workflow run. Deploy these artifacts to your preview host to provision an ephemeral environment.'
            });

  teardown-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Teardown placeholder
        run: echo "Hook your preview host teardown automation here for PR #${{ github.event.pull_request.number }}."
